<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send a Family Message</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #222;
    --muted: #777;
    --accent: #b3261e;
    --accent-ink: #ffffff;
    --border: #e2ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
  .recipients { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .recip-btn {
    padding: 16px 8px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: #fafaf7;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .recip-btn.selected { border-color: var(--accent); background: #fdeceb; color: var(--accent); }
  textarea {
    width: 100%;
    font-size: 1.1rem;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid var(--border);
    resize: none;
    font-family: inherit;
  }
  .count { text-align: right; color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .send-btn {
    width: 100%;
    padding: 16px;
    font-size: 1.15rem;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    margin-top: 8px;
  }
  .send-btn:disabled { opacity: 0.5; }
  .status { text-align: center; margin-top: 14px; font-size: 0.95rem; min-height: 1.4em; }
  .status.ok { color: #2e7d32; }
  .status.err { color: var(--accent); }
  .settings-toggle {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 30px;
    cursor: pointer;
    text-decoration: underline;
  }
  .settings-panel input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .hidden { display: none; }
  .save-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--ink);
    color: #fff;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Send a Family Message</h1>
  <div class="sub">Pick who it's for, type your message, hit send.</div>

  <div class="card">
    <label>To</label>
    <div class="recipients" id="recipients"></div>
  </div>

  <div class="card">
    <label>Message</label>
    <textarea id="msgBox" rows="3" maxlength="80" placeholder="Type your message..."></textarea>
    <div class="count"><span id="charCount">0</span>/80</div>

    <label style="margin-top:14px;">Word to flash while it scrolls (optional)</label>
    <input type="text" id="flashWordBox" maxlength="40" placeholder="e.g. a name or one word from your message" style="width:100%;padding:10px;border-radius:8px;border:2px solid var(--border);font-size:1rem;">

    <label style="margin-top:14px;">Word/phrase to flash at the end (optional)</label>
    <input type="text" id="endWordBox" maxlength="40" placeholder="e.g. Love you! or Yeah!" style="width:100%;padding:10px;border-radius:8px;border:2px solid var(--border);font-size:1rem;">

    <button class="send-btn" id="sendBtn" style="margin-top:16px;">Send</button>
    <div class="status" id="status"></div>
  </div>

  <div class="settings-toggle" id="settingsToggle">Account settings</div>
  <div class="card settings-panel hidden" id="settingsPanel">
    <label>Adafruit IO Username</label>
    <input type="text" id="aioUser" autocomplete="off" autocapitalize="off">
    <label>Adafruit IO Key</label>
    <input type="password" id="aioKey" autocomplete="off" autocapitalize="off">
    <button class="save-btn" id="saveSettings">Save on this device</button>
    <div class="sub" style="margin-top:10px;">
      Saved only in this browser, on this device. Never sent anywhere except
      directly to your Adafruit IO account.
    </div>
    <div class="sub" id="storedPreview" style="margin-top:10px; font-family: monospace;"></div>
  </div>
</div>

<script>
  // ---- Recipients: keys are plain, lowercase feed names -- no group
  // prefix. If a key below doesn't work, check the exact spelling in
  // your browser's address bar on that feed's page and adjust here. ----
  const RECIPIENTS = [
    { label: "Grampa (test)", key: "grampa" },
    { label: "Aaron",         key: "aaron" },
    { label: "Ginny",         key: "ginny" },
    { label: "Daniel",        key: "daniel" },
    { label: "John",          key: "john" },
  ];

  let selectedKey = null;

  const recipientsDiv = document.getElementById('recipients');
  RECIPIENTS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'recip-btn';
    btn.textContent = r.label;
    btn.onclick = () => {
      document.querySelectorAll('.recip-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedKey = r.key;
    };
    recipientsDiv.appendChild(btn);
  });

  const msgBox = document.getElementById('msgBox');
  const charCount = document.getElementById('charCount');
  msgBox.addEventListener('input', () => { charCount.textContent = msgBox.value.length; });

  const statusEl = document.getElementById('status');
  const sendBtn = document.getElementById('sendBtn');

  // ---- Settings (stored only in this browser) ----
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const aioUserInput = document.getElementById('aioUser');
  const aioKeyInput = document.getElementById('aioKey');

  function loadSettings() {
    try {
      aioUserInput.value = localStorage.getItem('aio_username') || '';
      aioKeyInput.value = localStorage.getItem('aio_key') || '';
    } catch (e) { /* storage unavailable, ignore */ }
    showStoredPreview();
  }
  loadSettings();

  function showStoredPreview() {
    const preview = document.getElementById('storedPreview');
    const u = aioUserInput.value;
    const k = aioKeyInput.value;
    const maskedKey = k.length > 8 ? `${k.slice(0,4)}...${k.slice(-4)} (${k.length} chars)` : (k ? `(${k.length} chars, too short to preview)` : '(empty)');
    preview.textContent = `Currently saved -> username: "${u || '(empty)'}", key: ${maskedKey}`;
  }

  settingsToggle.onclick = () => settingsPanel.classList.toggle('hidden');

  document.getElementById('saveSettings').onclick = () => {
    try {
      localStorage.setItem('aio_username', aioUserInput.value.trim());
      localStorage.setItem('aio_key', aioKeyInput.value.trim());
      showStoredPreview();
      statusEl.textContent = 'Settings saved on this device.';
      statusEl.className = 'status ok';
    } catch (e) {
      statusEl.textContent = 'Could not save settings on this device.';
      statusEl.className = 'status err';
    }
  };

  // If no credentials saved yet, open settings automatically
  if (!aioUserInput.value || !aioKeyInput.value) {
    settingsPanel.classList.remove('hidden');
  }

  sendBtn.onclick = async () => {
    const username = aioUserInput.value.trim();
    const key = aioKeyInput.value.trim();
    const text = msgBox.value.trim();
    const flashWord = document.getElementById('flashWordBox').value.trim();
    const endWord = document.getElementById('endWordBox').value.trim();

    if (!username || !key) {
      statusEl.textContent = 'Add your Adafruit IO username and key in Account settings first.';
      statusEl.className = 'status err';
      settingsPanel.classList.remove('hidden');
      return;
    }
    if (!selectedKey) {
      statusEl.textContent = 'Pick who this message is for.';
      statusEl.className = 'status err';
      return;
    }
    if (!text) {
      statusEl.textContent = 'Type a message first.';
      statusEl.className = 'status err';
      return;
    }

    sendBtn.disabled = true;
    statusEl.textContent = 'Sending...';
    statusEl.className = 'status';

    try {
      const url = `https://io.adafruit.com/api/v2/${encodeURIComponent(username)}/feeds/${encodeURIComponent(selectedKey)}/data`;
      // Package message + optional flash words into one JSON string --
      // the sign parses this back out on its end. flash/end are left
      // out entirely when blank, so the sign knows not to flash anything.
      const packed = { msg: text };
      if (flashWord) packed.flash = flashWord;
      if (endWord) packed.end = endWord;

      const resp = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-AIO-Key': key
        },
        body: JSON.stringify({ value: JSON.stringify(packed) })
      });

      if (resp.ok) {
        statusEl.textContent = 'Sent! It should show up on the sign within about 15 seconds.';
        statusEl.className = 'status ok';
        msgBox.value = '';
        document.getElementById('flashWordBox').value = '';
        document.getElementById('endWordBox').value = '';
        charCount.textContent = '0';
      } else {
        const errText = await resp.text();
        statusEl.textContent = `Adafruit IO rejected the message. Status code: ${resp.status}. Details: ${errText}`;
        statusEl.className = 'status err';
        console.error('AIO error:', resp.status, errText);
      }
    } catch (err) {
      statusEl.textContent = 'Could not reach Adafruit IO. Check your internet connection.';
      statusEl.className = 'status err';
      console.error(err);
    } finally {
      sendBtn.disabled = false;
    }
  };
</script>
</body>
</html>
